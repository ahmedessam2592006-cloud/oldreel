<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Project | Old Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #141414;
  --bg-card: #1a1a1a;
  --accent-primary: #C9A96E;
  --accent-secondary: #8B7355;
  --accent-light: #E8D5B5;
  --text-primary: #F5F0E8;
  --text-secondary: #A8A29E;
  --text-muted: #6B6560;
  --glow-color: rgba(201, 169, 110, 0.25);
  --border-color: rgba(201, 169, 110, 0.15);
  --font-heading: 'Playfair Display', serif;
  --font-body: 'Inter', sans-serif;
  --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
[data-theme="light"] {
  --bg-primary: #F5F0E8;
  --bg-secondary: #E8E2D9;
  --bg-card: #EDE8E0;
  --text-primary: #1a1a1a;
  --text-secondary: #4a4a4a;
  --text-muted: #8a8a8a;
  --glow-color: rgba(201, 169, 110, 0.2);
  --border-color: rgba(201, 169, 110, 0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.5s ease, color 0.5s ease;
}

.custom-cursor {
  position: fixed; width: 28px; height: 28px;
  border: 2px solid var(--accent-primary); border-radius: 50%;
  pointer-events: none; z-index: 99999; transform: translate(-50%, -50%);
  transition: width 0.25s ease, height 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  mix-blend-mode: difference;
}
.custom-cursor::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 5px; height: 5px; background: var(--accent-primary); border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: background 0.25s ease, width 0.25s ease, height 0.25s ease;
}
.custom-cursor.hover { width: 48px; height: 48px; border-color: var(--accent-light); background: rgba(201, 169, 110, 0.08); }
.custom-cursor.hover::after { width: 8px; height: 8px; background: var(--accent-light); }
@media (max-width: 768px) { .custom-cursor { display: none !important; } }

.floating-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
.floating-icon { position: absolute; color: var(--accent-primary); opacity: 0.06; animation: floatAround linear infinite; font-size: 22px; }
[data-theme="light"] .floating-icon { color: var(--accent-secondary); opacity: 0.1; }
@keyframes floatAround {
  0% { transform: translate(0, 0) rotate(0deg); }
  20% { transform: translate(40px, -60px) rotate(72deg); }
  40% { transform: translate(-30px, -120px) rotate(144deg); }
  60% { transform: translate(50px, -80px) rotate(216deg); }
  80% { transform: translate(-20px, -40px) rotate(288deg); }
  100% { transform: translate(0, 0) rotate(360deg); }
}

.scroll-progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent-primary), var(--accent-light)); z-index: 10001; width: 0%; transition: width 0.1s linear; }

.loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.6s ease, visibility 0.6s ease; }
.loader.hidden { opacity: 0; visibility: hidden; }
.loader-spinner { width: 50px; height: 50px; border: 2px solid var(--border-color); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.back-btn { position: fixed; top: 30px; left: 30px; z-index: 100; width: 50px; height: 50px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; color: var(--text-primary); font-size: 18px; text-decoration: none; transition: var(--transition); }
.back-btn:hover { background: var(--accent-primary); color: var(--bg-primary); transform: translateX(-5px); box-shadow: 0 0 20px var(--glow-color); }

.theme-toggle { position: fixed; top: 30px; right: 30px; z-index: 999; width: 45px; height: 45px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); box-shadow: 0 0 15px var(--glow-color); }
.theme-toggle:hover { transform: scale(1.1) rotate(15deg); }
.theme-toggle i { font-size: 18px; color: var(--accent-primary); }

.project-hero { min-height: 60vh; display: flex; align-items: center; justify-content: center; position: relative; padding: 120px 50px 60px; text-align: center; z-index: 10; }
.project-hero::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, rgba(201,169,110,0.1), transparent 70%); }
.project-hero-content { position: relative; z-index: 10; max-width: 900px; }
.project-category { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-primary); margin-bottom: 20px; opacity: 0; transform: translateY(20px); }
.project-title { font-family: var(--font-heading); font-size: clamp(32px, 5vw, 56px); font-weight: 700; line-height: 1.1; margin-bottom: 25px; opacity: 0; transform: translateY(20px); }
.project-meta { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; opacity: 0; transform: translateY(20px); }
.meta-item { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 14px; }
.meta-item i { color: var(--accent-primary); }

.video-container { width: 100%; max-width: 1100px; margin: 0 auto 60px; padding: 0 25px; position: relative; z-index: 10; }
.video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
.video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

.project-details { max-width: 900px; margin: 0 auto; padding: 0 50px 80px; position: relative; z-index: 10; }
.project-details h3 { font-family: var(--font-heading); font-size: 28px; margin-bottom: 20px; color: var(--text-primary); }
.project-details p { font-size: 16px; line-height: 1.9; color: var(--text-secondary); margin-bottom: 30px; }
.project-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
.gallery-img { width: 100%; border-radius: 12px; border: 1px solid var(--border-color); transition: var(--transition); }
.gallery-img:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 40px rgba(201,169,110,0.15); border-color: var(--accent-primary); }

.next-project { text-align: center; padding: 80px 50px; background: linear-gradient(180deg, transparent, rgba(201,169,110,0.05)); position: relative; z-index: 10; }
.next-project h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 20px; }
.next-project a { color: var(--text-primary); font-size: 28px; font-weight: 700; text-decoration: none; font-family: var(--font-heading); transition: var(--transition); display: inline-block; }
.next-project a:hover { color: var(--accent-primary); transform: translateX(10px); }

.whatsapp-float { position: fixed; bottom: 30px; right: 30px; z-index: 1000; text-decoration: none; display: none; align-items: center; transition: var(--transition); }
.whatsapp-btn { position: relative; width: 50px; height: 50px; background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; box-shadow: 0 4px 15px rgba(37,211,102,0.4); animation: floatY 2.5s ease-in-out infinite; }
.whatsapp-btn::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #25D366; opacity: 0; animation: whatsappPulse 2s infinite; }
@keyframes whatsappPulse { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.4); opacity: 0; } }
@keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

@media (max-width: 768px) {
  .project-hero { padding: 100px 25px 40px; }
  .project-details { padding: 0 25px 50px; }
  .project-meta { gap: 15px; }
  .theme-toggle { top: 15px; right: 15px; width: 40px; height: 40px; }
  .back-btn { top: 15px; left: 15px; width: 40px; height: 40px; }
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 3px; }
</style>
</head>
<body>

<div class="custom-cursor" id="customCursor"></div>
<div class="scroll-progress" id="scrollProgress"></div>
<div class="floating-bg" id="floatingBg"></div>

<div class="loader" id="loader"><div class="loader-spinner"></div></div>

<div class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
  <i class="fas fa-moon" id="themeIcon"></i>
</div>

<a href="index.html#portfolio" class="back-btn"><i class="fas fa-arrow-left"></i></a>

<section class="project-hero">
  <div class="project-hero-content">
    <div class="project-category" id="pCategory">Commercial</div>
    <h1 class="project-title" id="pTitle">Project Title</h1>
    <div class="project-meta">
      <div class="meta-item"><i class="fas fa-calendar"></i><span id="pDate">2024</span></div>
      <div class="meta-item"><i class="fas fa-tag"></i><span id="pClient">Client Name</span></div>
      <div class="meta-item"><i class="fas fa-laptop-code"></i><span id="pSoftware">Premiere Pro</span></div>
    </div>
  </div>
</section>

<div class="video-container">
  <div class="video-wrapper" id="videoWrapper">
    <iframe id="pVideo" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
</div>

<div class="project-details">
  <h3>About the Project</h3>
  <p id="pDescription">Project description goes here...</p>
  <h3 style="margin-top:50px">Gallery</h3>
  <div class="project-gallery" id="pGallery"></div>
</div>

<div class="next-project">
  <h3>Want to see more?</h3>
  <a href="index.html#portfolio">View All Videos <i class="fas fa-arrow-right"></i></a>
</div>

<a href="#" class="whatsapp-float" id="whatsappFloat" target="_blank">
  <div class="whatsapp-btn"><i class="fab fa-whatsapp"></i></div>
</a>

<script src="firebase-config.js"></script>
<script>
let currentTheme = 'dark';
function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(currentTheme);
  localStorage.setItem('oldreel-theme', currentTheme);
}
function applyTheme(theme) {
  currentTheme = theme || 'dark';
  document.body.setAttribute('data-theme', currentTheme);
  document.getElementById('themeIcon').className = currentTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
  updateFloatingIcons();
}
const savedTheme = localStorage.getItem('oldreel-theme');
if (savedTheme) applyTheme(savedTheme);
else {
  db.ref('oldreel/settings/appearance').once('value').then(snapshot => {
    const d = snapshot.val() || {};
    applyTheme(d.theme || 'dark');
  });
}

// CUSTOM CURSOR
const cursor = document.getElementById('customCursor');
let cursorX = 0, cursorY = 0, currentX = 0, currentY = 0;
document.addEventListener('mousemove', (e) => {
  cursorX = e.clientX;
  cursorY = e.clientY;
});
function animateCursor() {
  currentX += (cursorX - currentX) * 0.12;
  currentY += (cursorY - currentY) * 0.12;
  cursor.style.left = currentX + 'px';
  cursor.style.top = currentY + 'px';
  requestAnimationFrame(animateCursor);
}
if (window.innerWidth > 768) animateCursor();

document.querySelectorAll('a, button, .back-btn, .theme-toggle, .gallery-img').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
});

// FLOATING BACKGROUND ICONS
const editingIcons = [
  'fa-film', 'fa-scissors', 'fa-video', 'fa-clapperboard', 'fa-photo-video',
  'fa-music', 'fa-cut', 'fa-compact-disc', 'fa-play-circle', 'fa-stopwatch',
  'fa-sliders-h', 'fa-adjust', 'fa-palette', 'fa-vector-square', 'fa-crop-alt',
  'fa-tape', 'fa-microphone', 'fa-headphones', 'fa-camera', 'fa-film'
];
function createFloatingIcons() {
  const container = document.getElementById('floatingBg');
  container.innerHTML = '';
  const count = 20;
  for (let i = 0; i < count; i++) {
    const icon = document.createElement('i');
    icon.className = 'fas ' + editingIcons[Math.floor(Math.random() * editingIcons.length)] + ' floating-icon';
    icon.style.left = Math.random() * 100 + '%';
    icon.style.top = Math.random() * 100 + '%';
    icon.style.fontSize = (18 + Math.random() * 30) + 'px';
    icon.style.animationDuration = (15 + Math.random() * 25) + 's';
    icon.style.animationDelay = (Math.random() * 10) + 's';
    icon.style.opacity = currentTheme === 'light' ? '0.1' : '0.06';
    container.appendChild(icon);
  }
}
function updateFloatingIcons() {
  document.querySelectorAll('.floating-icon').forEach(icon => {
    icon.style.opacity = currentTheme === 'light' ? '0.1' : '0.06';
  });
}
createFloatingIcons();

// SCROLL PROGRESS
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = (scrollTop / docHeight) * 100;
  document.getElementById('scrollProgress').style.width = progress + '%';
});

const urlParams = new URLSearchParams(window.location.search);
const projectId = urlParams.get('id');
if (!projectId) window.location.href = 'index.html#portfolio';

window.addEventListener('load', () => {
  // Load WhatsApp
  db.ref('oldreel/settings/social').once('value').then(snapshot => {
    const d = snapshot.val() || {};
    const wfloat = document.getElementById('whatsappFloat');
    if (d.whatsapp && d.showWhatsapp !== false) {
      const cleanNum = d.whatsapp.replace(/[^0-9+]/g, '');
      wfloat.href = 'https://wa.me/' + cleanNum;
      wfloat.style.display = 'flex';
    }
  });

  // Load project
  db.ref('oldreel/videos/' + projectId).once('value').then(snapshot => {
    const p = snapshot.val();
    if (p) {
      document.getElementById('pCategory').textContent = p.category || 'Video';
      document.getElementById('pTitle').textContent = p.title || 'Untitled';
      document.getElementById('pDate').textContent = p.year || '2024';
      document.getElementById('pClient').textContent = p.client || 'Personal Project';
      document.getElementById('pSoftware').textContent = p.software || 'Premiere Pro';
      document.getElementById('pDescription').textContent = p.description || 'No description available.';

      // Video embed
      if (p.type === 'youtube' && p.youtubeId) {
        document.getElementById('pVideo').src = 'https://www.youtube.com/embed/' + p.youtubeId;
      } else if (p.driveFileId) {
        document.getElementById('pVideo').src = 'https://drive.google.com/file/d/' + p.driveFileId + '/preview';
      } else if (p.driveUrl) {
        document.getElementById('pVideo').src = p.driveUrl;
      }

      // Gallery
      const gallery = document.getElementById('pGallery');
      if (p.gallery && p.gallery.length > 0) {
        p.gallery.forEach(img => {
          const el = document.createElement('img');
          el.src = img; el.className = 'gallery-img'; el.alt = 'Gallery';
          gallery.appendChild(el);
        });
      } else if (p.thumbnail) {
        gallery.innerHTML = '<img src="' + p.thumbnail + '" class="gallery-img" alt="Project">';
      }

      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
        gsap.to('.project-category', { opacity: 1, y: 0, duration: 0.8, delay: 0.2 });
        gsap.to('.project-title', { opacity: 1, y: 0, duration: 1, delay: 0.4, ease: 'power3.out' });
        gsap.to('.project-meta', { opacity: 1, y: 0, duration: 0.8, delay: 0.6 });
        gsap.to('.video-container', { opacity: 1, y: 0, duration: 1.2, delay: 0.8, ease: 'power3.out' });
        gsap.to('.project-details', { opacity: 1, y: 0, duration: 0.8, delay: 1 });
      }, 800);
    } else {
      document.getElementById('loader').classList.add('hidden');
      document.querySelector('.project-hero-content').innerHTML = '<h1 style="font-size:48px">Project Not Found</h1>';
    }
  }).catch(err => {
    console.error(err);
    document.getElementById('loader').classList.add('hidden');
  });
});
</script>
</body>
</html>
